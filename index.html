<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Arena - 3D Edition</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด Babel สำหรับคอมไพล์ React (JSX) ในเบราว์เซอร์ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        
        .perspective-1000 { perspective: 1000px; }
        .transform-3d { transform-style: preserve-3d; }
        .btn-3d { position: relative; transition: all 0.1s ease; transform: translateY(0); }
        .btn-3d:active:not(:disabled) { transform: translateY(6px) !important; box-shadow: 0 0px 0 0 var(--btn-shadow, rgba(0,0,0,0.5)), inset 0 4px 8px rgba(0,0,0,0.4) !important; }
        .btn-3d:disabled { transform: translateY(6px); opacity: 0.7; }
        .card-3d { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-3d:hover { transform: translateZ(20px) rotateX(2deg) rotateY(-2deg); z-index: 10; }
        .monitor-3d { box-shadow: inset 0 20px 50px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.1), 0 20px 40px rgba(0,0,0,0.7); border-top: 2px solid rgba(255,255,255,0.2); border-bottom: 6px solid rgba(0,0,0,0.9); }
        
        @keyframes float { 0%, 100% { transform: translateY(0px) translateZ(40px); } 50% { transform: translateY(-20px) translateZ(40px); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .bg-grid-pattern { background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px); background-size: 40px 40px; }
    </style>
</head>
<body>
    <!-- พื้นที่สำหรับแสดงผล React -->
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Settings, Users, Plus, Trash2, Crown, RefreshCw, 
          CheckCircle2, AlertCircle, BarChart3, PieChart, List, 
          Timer, Palette, Edit3, Trophy, Gamepad2, X, Play,
          Lock, Unlock, Clock, PlayCircle, StopCircle, PlusCircle, KeyRound,
          Maximize, Music, Volume2, Power, ArrowDownToLine, ArrowUpToLine
        } from 'https://esm.sh/lucide-react@0.292.0';
        import { 
          BarChart, Bar, XAxis, YAxis, Tooltip as RechartsTooltip, ResponsiveContainer, 
          PieChart as RePieChart, Pie, Cell, Legend
        } from 'https://esm.sh/recharts@2.10.3';

        // --- เสียงประกอบ (ใช้ไฟล์เสียง Public Domain / Creative Commons ที่อนุญาตให้ใช้ได้) ---
        const BGM_TRACKS = {
          track1: { name: '🎮 ตื่นเต้น (Action/Upbeat)', url: 'https://upload.wikimedia.org/wikipedia/commons/4/4c/Funk_Game_Loop.ogg' },
          track2: { name: '😰 ลุ้นระทึก (Suspense/Tense)', url: 'https://upload.wikimedia.org/wikipedia/commons/a/a9/Tense_Ambience.ogg' },
          track3: { name: '🕹️ สนุกสนาน (Retro Arcade)', url: 'https://upload.wikimedia.org/wikipedia/commons/e/e5/Tetris_theme.ogg' }
        };

        function App() {
          // Application Entry State
          const [hasEntered, setHasEntered] = useState(false);

          // Voting Content State
          const [topicTitle, setTopicTitle] = useState('ศึกตัดสิน: กิจกรรมวันหยุดประจำปี! 🏖️');
          const [options, setOptions] = useState([
            { id: 1, text: 'ไปเที่ยวทะเล', votes: 12, emoji: '🌊', color: '#0ea5e9' },
            { id: 2, text: 'ขึ้นภูเขา/กางเต็นท์', votes: 8, emoji: '⛺', color: '#22c55e' },
            { id: 3, text: 'นอนดูซีรีส์อยู่บ้าน', votes: 5, emoji: '🛋️', color: '#8b5cf6' },
          ]);
          
          const [view, setView] = useState('user');
          const [chartView, setChartView] = useState('list');
          
          // Admin Auth State
          const [isAdminAuth, setIsAdminAuth] = useState(false);
          const [pinInput, setPinInput] = useState('');
          const ADMIN_PIN = '8888';
          const [pinError, setPinError] = useState(false);

          // Voting Control State
          const [votingState, setVotingState] = useState('waiting'); // 'waiting', 'active', 'locked'
          const [votingDurationSetting, setVotingDurationSetting] = useState(30);
          const [votingTimeLeft, setVotingTimeLeft] = useState(0);

          // Game Rule State
          const [winCondition, setWinCondition] = useState('highest'); // 'highest' or 'lowest'

          // Result Process State
          const [showResultOverlay, setShowResultOverlay] = useState(false); 
          const [isSpinning, setIsSpinning] = useState(false);
          const [countdownSetting, setCountdownSetting] = useState(10); 
          const [timeLeft, setTimeLeft] = useState(null); 
          const [winner, setWinner] = useState(null);

          // Modal State
          const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', desc: '', action: null });

          // Option Form State
          const [newOptionText, setNewOptionText] = useState('');
          const [newOptionEmoji, setNewOptionEmoji] = useState('✨');
          const [newOptionColor, setNewOptionColor] = useState('#f59e0b');

          // Audio State
          const [bgmTrack, setBgmTrack] = useState('track1');
          const [isBgmPlaying, setIsBgmPlaying] = useState(false);
          const audioRef = useRef(null);

          const totalVotes = options.reduce((sum, opt) => sum + opt.votes, 0);
          
          const chartData = [...options].sort((a, b) => b.votes - a.votes).map(opt => ({
            name: opt.text,
            votes: opt.votes,
            fill: opt.color
          }));

          // ฟังก์ชันเข้าสู่ระบบและบังคับ Fullscreen
          const handleEnterSystem = () => {
            setHasEntered(true);
            setIsBgmPlaying(true); // เริ่มเล่นเพลงอัตโนมัติ

            const elem = document.documentElement;
            if (elem.requestFullscreen) {
              elem.requestFullscreen().catch((err) => console.log("Fullscreen blocked by browser", err));
            } else if (elem.webkitRequestFullscreen) { /* Safari */
              elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
              elem.msRequestFullscreen();
            }
          };

          // ควบคุมการเล่นเพลง
          useEffect(() => {
            if (audioRef.current) {
              if (isBgmPlaying) {
                audioRef.current.play().catch(e => console.log("Audio autoplay prevented", e));
              } else {
                audioRef.current.pause();
              }
            }
          }, [isBgmPlaying, bgmTrack]);

          // ฟังก์ชันเริ่มกระบวนการประกาศผล
          const startProcess = () => {
            if (options.length === 0) return;
            setShowResultOverlay(true); 
            setIsSpinning(true);
            setWinner(null);
            setTimeLeft(countdownSetting);

            const timerInterval = setInterval(() => {
              setTimeLeft((prev) => {
                if (prev <= 1) {
                  clearInterval(timerInterval);
                  determineWinner(); 
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
          };

          // ประมวลผลผู้ชนะ (รองรับทั้ง Highest และ Lowest)
          const determineWinner = () => {
            setTimeLeft(null);
            if (totalVotes === 0) {
              // ถ้าไม่มีใครโหวตเลย สุ่มแบบปกติ
              const randomIndex = Math.floor(Math.random() * options.length);
              setWinner(options[randomIndex]);
            } else {
              let targetVotes;
              if (winCondition === 'highest') {
                targetVotes = Math.max(...options.map(o => o.votes));
              } else {
                targetVotes = Math.min(...options.map(o => o.votes));
              }
              
              const eligibleOptions = options.filter(o => o.votes === targetVotes);
              // ถ้ามีคะแนนเท่ากันหลายอัน ให้สุ่มจากกลุ่มนั้น
              const selectedWinner = eligibleOptions[Math.floor(Math.random() * eligibleOptions.length)];
              setWinner(selectedWinner);
            }
            setIsSpinning(false);
          };

          // Timer Effect
          useEffect(() => {
            let interval;
            if (votingState === 'active' && votingTimeLeft > 0) {
              interval = setInterval(() => {
                setVotingTimeLeft((prev) => prev - 1);
              }, 1000);
            } else if (votingState === 'active' && votingTimeLeft === 0) {
              setVotingState('locked');
              startProcess();
            }
            return () => clearInterval(interval);
          }, [votingState, votingTimeLeft]);

          const handlePinInput = (num) => {
            setPinError(false);
            if (pinInput.length < 4) {
              const newPin = pinInput + num;
              setPinInput(newPin);
              if (newPin.length === 4) {
                if (newPin === ADMIN_PIN) {
                  setTimeout(() => { setIsAdminAuth(true); setPinInput(''); }, 300);
                } else {
                  setPinError(true);
                  setTimeout(() => setPinInput(''), 500);
                }
              }
            }
          };

          const handleStartVoting = () => {
            setWinner(null);
            setVotingTimeLeft(votingDurationSetting);
            setVotingState('active');
          };

          const handleExtendVoting = () => {
            setVotingTimeLeft(prev => prev + 15);
            setVotingState('active');
          };

          const handleStopVoting = () => {
            setVotingTimeLeft(0);
            setVotingState('locked');
            startProcess(); 
          };

          const handleVote = (id) => {
            if (votingState !== 'active') return;
            setOptions(options.map(opt => 
              opt.id === id ? { ...opt, votes: opt.votes + 1 } : opt
            ));
          };

          const handleAddOption = (e) => {
            e.preventDefault();
            if (!newOptionText.trim()) return;
            const newId = options.length > 0 ? Math.max(...options.map(o => o.id)) + 1 : 1;
            setOptions([...options, { 
              id: newId, text: newOptionText.trim(), votes: 0,
              emoji: newOptionEmoji || '✨', color: newOptionColor
            }]);
            setNewOptionText('');
            const randomColors = ['#f43f5e', '#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#06b6d4', '#ef4444', '#8b5cf6'];
            setNewOptionColor(randomColors[Math.floor(Math.random() * randomColors.length)]);
          };

          const handleDeleteOption = (id) => setOptions(options.filter(opt => opt.id !== id));
          const openConfirmDialog = (title, desc, action) => setConfirmDialog({ isOpen: true, title, desc, action });

          const handleResetVotes = () => {
            openConfirmDialog('⚠️ ยืนยันการล้างคะแนน', 'คะแนนโหวตของทุกตัวเลือกจะถูกรีเซ็ตเป็น 0 คุณแน่ใจหรือไม่?', () => {
              setOptions(options.map(opt => ({ ...opt, votes: 0 })));
              setWinner(null); setVotingState('waiting');
            });
          };

          const handleResetAll = () => {
              openConfirmDialog('🚨 ลบข้อมูลทั้งหมด', 'ตัวเลือกและคะแนนทั้งหมดจะถูกลบเพื่อเริ่มต้นใหม่ ต้องการดำเนินการต่อหรือไม่?', () => {
                  setOptions([]); setWinner(null); setVotingState('waiting');
              });
          }

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
          };

          // -------------------------------------------------------------
          // SCREEN 1: WELCOME / ENTRY SCREEN
          // -------------------------------------------------------------
          if (!hasEntered) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center relative overflow-hidden perspective-1000">
                <div className="absolute inset-0 bg-grid-pattern opacity-40 transform-3d rotate-x-12 scale-150 origin-bottom"></div>
                <div className="absolute w-96 h-96 bg-fuchsia-600/30 rounded-full blur-[100px] animate-pulse"></div>
                
                <div className="z-10 flex flex-col items-center animate-in zoom-in duration-700">
                  <Gamepad2 size={100} className="text-white mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.5)] animate-bounce" />
                  <h1 className="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-fuchsia-400 mb-2 tracking-widest text-center uppercase" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.2)' }}>
                    VOTE ARENA
                  </h1>
                  <p className="text-slate-400 text-lg mb-12 tracking-widest uppercase font-bold">Interactive Polling System</p>
                  
                  <button 
                    onClick={handleEnterSystem}
                    className="group bg-indigo-600 text-white text-2xl font-black px-12 py-6 rounded-2xl btn-3d flex items-center gap-4 border-2 border-indigo-400"
                    style={{ '--btn-shadow': '#3730a3', boxShadow: '0 8px 0 #3730a3, 0 15px 30px rgba(0,0,0,0.5)' }}
                  >
                    <Power className="group-hover:animate-spin" size={32} />
                    PRESS START
                  </button>
                  <p className="text-slate-500 mt-6 text-sm flex items-center gap-2"><Maximize size={16}/> ระบบจะแสดงผลแบบเต็มหน้าจออัตโนมัติ</p>
                </div>
              </div>
            );
          }

          // -------------------------------------------------------------
          // SCREEN 2: MAIN APPLICATION
          // -------------------------------------------------------------
          return (
            <div className="relative min-h-screen w-full bg-slate-950 font-sans text-slate-800 overflow-x-hidden perspective-1000">
              
              {/* Audio Element (Hidden) */}
              <audio ref={audioRef} src={BGM_TRACKS[bgmTrack].url} loop preload="auto" />

              {/* Game Background Elements */}
              <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-slate-950">
                <div className="absolute inset-0 bg-grid-pattern opacity-30 transform-3d rotate-x-12 scale-150 origin-bottom"></div>
                <div className="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-fuchsia-600/20 rounded-full blur-[100px] animate-pulse"></div>
                <div className="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] bg-cyan-600/20 rounded-full blur-[120px] animate-pulse delay-700"></div>
              </div>
              
              {/* Dialog Modal */}
              {confirmDialog.isOpen && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] w-full max-w-sm p-6 animate-in zoom-in-95 duration-200 transform-3d">
                    <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2"><AlertCircle className="text-rose-500" /> {confirmDialog.title}</h3>
                    <p className="text-slate-300 mb-6">{confirmDialog.desc}</p>
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setConfirmDialog({ isOpen: false })} className="px-5 py-2.5 text-slate-300 hover:bg-slate-800 rounded-xl font-medium">ยกเลิก</button>
                      <button onClick={() => { confirmDialog.action(); setConfirmDialog({ isOpen: false }); }} className="px-5 py-2.5 bg-rose-600 text-white rounded-xl font-bold btn-3d" style={{ '--btn-shadow': '#9f1239', boxShadow: '0 6px 0 #9f1239' }}>ยืนยัน</button>
                    </div>
                  </div>
                </div>
              )}

              {/* 🌟 FULLSCREEN RESULT OVERLAY 🌟 */}
              {showResultOverlay && (
                <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-2xl p-4 overflow-hidden perspective-1000 animate-in fade-in duration-500">
                  
                  <div className="absolute inset-0 overflow-hidden pointer-events-none">
                     <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90vw] h-[90vw] bg-indigo-600/10 rounded-full blur-[150px] animate-pulse"></div>
                  </div>

                  <h3 className="text-3xl md:text-5xl font-black text-white mb-8 uppercase tracking-widest text-center z-10 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)] flex items-center justify-center gap-4 animate-in slide-in-from-top-10 duration-700">
                    <Crown className="text-yellow-400" size={48} />
                    {winCondition === 'highest' ? 'ผู้ชนะคะแนนสูงสุด!' : 'ผู้ชนะคะแนนน้อยสุด!'}
                    <Crown className="text-yellow-400" size={48} />
                  </h3>

                  <div 
                    className={`w-full max-w-4xl h-[40vh] min-h-[350px] flex items-center justify-center rounded-[3rem] relative monitor-3d transition-all duration-1000 ${
                      winner ? 'border-4 border-yellow-400 scale-105' : 'bg-slate-900 border-4 border-slate-800'
                    }`}
                    style={{ backgroundColor: winner ? winner.color : undefined }}
                  >
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/pixel-weave.png')] opacity-20 mix-blend-overlay pointer-events-none rounded-[3rem]"></div>
                    {!winner && !isSpinning && <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-500/20 via-transparent to-transparent animate-pulse rounded-[3rem]"></div>}
                    
                    {isSpinning && timeLeft !== null ? (
                      <div className="flex flex-col items-center justify-center animate-in zoom-in duration-300 relative z-10 transform-3d">
                        <span className="text-cyan-400 font-black mb-4 tracking-widest text-lg md:text-xl uppercase flex items-center gap-2 bg-black/50 px-6 py-2 rounded-full border border-cyan-500/30 shadow-[0_0_20px_rgba(34,211,238,0.2)]">
                          <Timer size={24} className="animate-spin" /> ค้นหาผู้ชนะ...
                        </span>
                        <div className="text-[8rem] md:text-[12rem] font-black text-white tabular-nums drop-shadow-[0_0_40px_rgba(255,255,255,0.8)] leading-none">{timeLeft}</div>
                      </div>
                    ) : winner ? (
                      <div className="flex flex-col items-center justify-center animate-in zoom-in-50 duration-700 z-10 w-full px-4 transform-3d">
                        <div className="absolute inset-0 opacity-40 animate-spin-slow rounded-[3rem]" style={{ background: 'repeating-conic-gradient(from 0deg, transparent 0deg 15deg, white 15deg 30deg)' }}></div>
                        <div className="text-[6rem] md:text-[8rem] mb-4 drop-shadow-[0_20px_40px_rgba(0,0,0,0.6)] bg-white/20 w-40 h-40 md:w-56 md:h-56 flex items-center justify-center rounded-full animate-float backdrop-blur-md border-4 border-white/80 z-10">
                          {winner.emoji}
                        </div>
                        <div className="text-4xl md:text-6xl font-black text-white text-center leading-tight drop-shadow-[0_8px_20px_rgba(0,0,0,0.9)] z-10 px-4">{winner.text}</div>
                        <div className="mt-6 text-slate-900 font-black text-2xl md:text-3xl bg-white px-8 py-3 rounded-full shadow-[0_15px_30px_rgba(0,0,0,0.5)] z-10 transform -rotate-2 border-4 border-yellow-400">
                          ชนะด้วย: {winner.votes} โหวต 🎉
                        </div>
                      </div>
                    ) : null}
                  </div>

                  {view === 'admin' && (
                    <div className="mt-10 z-10 flex gap-4 animate-in slide-in-from-bottom-10 duration-700 delay-300 fill-mode-both">
                      <button onClick={() => setShowResultOverlay(false)} className="bg-slate-800 hover:bg-slate-700 text-white px-8 py-4 rounded-2xl font-black text-lg btn-3d border border-slate-600 shadow-[0_6px_0_#334155]" style={{'--btn-shadow': '#334155'}}>
                        ปิดหน้าต่าง (ดูสถิติรวม)
                      </button>
                    </div>
                  )}
                  {view === 'user' && winner && (
                     <div className="mt-10 z-10 text-white/50 font-bold animate-pulse">รอแอดมินปิดหน้าต่างประกาศผล...</div>
                  )}
                </div>
              )}

              {/* Main Container */}
              <div className="relative z-10 w-full min-h-screen flex flex-col items-center p-2 sm:p-4 md:p-8 transform-3d">
                
                {/* 3D Console Glass Frame */}
                <div className="w-full max-w-5xl bg-white/90 backdrop-blur-2xl rounded-[2rem] shadow-[0_20px_60px_rgba(0,0,0,0.6),inset_0_2px_4px_rgba(255,255,255,0.8)] border border-white/20 overflow-hidden flex flex-col h-fit transform-3d">
                  
                  {/* Top Navigation Bar */}
                  <div className="flex p-2 gap-2 bg-slate-900/5 backdrop-blur-md border-b border-slate-200/50 relative z-20">
                    <button 
                      onClick={() => setView('user')}
                      className={`flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl font-black transition-all duration-300 text-sm md:text-base btn-3d ${
                        view === 'user' ? 'bg-white text-indigo-600' : 'bg-slate-200 text-slate-500 hover:bg-white/50'
                      }`}
                      style={{ '--btn-shadow': view === 'user' ? '#cbd5e1' : '#94a3b8', boxShadow: view === 'user' ? '0 4px 0 #cbd5e1' : '0 4px 0 #e2e8f0' }}
                    >
                      <Gamepad2 size={22} className={view === 'user' ? 'animate-bounce' : ''} /> PLAYER ZONE
                    </button>
                    <button 
                      onClick={() => setView('admin')}
                      className={`flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl font-black transition-all duration-300 text-sm md:text-base btn-3d ${
                        view === 'admin' ? 'bg-slate-900 text-rose-400' : 'bg-slate-200 text-slate-500 hover:bg-white/50'
                      }`}
                      style={{ '--btn-shadow': view === 'admin' ? '#0f172a' : '#94a3b8', boxShadow: view === 'admin' ? '0 4px 0 #0f172a' : '0 4px 0 #e2e8f0' }}
                    >
                      <Lock size={22} /> ADMIN ROOM
                    </button>
                  </div>

                  <div className="p-4 sm:p-6 md:p-10 bg-slate-50/50 relative z-10">
                    
                    {view === 'user' && (
                      <div className="space-y-6 md:space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500 transform-3d">
                        
                        {/* Topic & Timer Header */}
                        <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-6 md:p-8 shadow-xl text-white transform-3d border-b-4 border-indigo-950">
                          <div className="absolute top-0 right-0 p-4 opacity-10"><Gamepad2 size={150} /></div>
                          <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div className="flex-1">
                              <h2 className="text-2xl md:text-4xl font-black tracking-tight leading-tight mb-3 drop-shadow-lg" style={{textShadow: '0 4px 10px rgba(0,0,0,0.5)'}}>{topicTitle}</h2>

                                💡 ข้อมูล: ระบบจะทำการค้นหาผู้ชนะตามกติกาที่เลือก (คะแนนมาก/น้อย) และ "ประกาศผลอัตโนมัติแบบเต็มจอ" ทันที เมื่อเวลาโหวตหมด
                              </p>
                            </div>

                          </div>
                        )}
                      </div>
                    )}

                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
