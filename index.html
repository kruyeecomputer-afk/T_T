<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Arena - Live Edition</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด Babel สำหรับคอมไพล์ React (JSX) ในเบราว์เซอร์ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        
        .perspective-1000 { perspective: 1000px; }
        .transform-3d { transform-style: preserve-3d; }
        .btn-3d { position: relative; transition: all 0.1s ease; transform: translateY(0); }
        .btn-3d:active:not(:disabled) { transform: translateY(6px) !important; box-shadow: 0 0px 0 0 var(--btn-shadow, rgba(0,0,0,0.5)), inset 0 4px 8px rgba(0,0,0,0.4) !important; }
        .btn-3d:disabled { transform: translateY(6px); opacity: 0.7; }
        .card-3d { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-3d:hover { transform: translateZ(20px) rotateX(2deg) rotateY(-2deg); z-index: 10; }
        .monitor-3d { box-shadow: inset 0 20px 50px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.1), 0 20px 40px rgba(0,0,0,0.7); border-top: 2px solid rgba(255,255,255,0.2); border-bottom: 6px solid rgba(0,0,0,0.9); }
        
        @keyframes float { 0%, 100% { transform: translateY(0px) translateZ(40px); } 50% { transform: translateY(-20px) translateZ(40px); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .bg-grid-pattern { background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px); background-size: 40px 40px; }
        
        /* สไตล์สำหรับแจ้งเตือนคัดลอกลิงก์ */
        .toast { transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.hide { opacity: 0; transform: translateY(-20px); pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Settings, Users, Plus, Trash2, Crown, RefreshCw, 
          CheckCircle2, AlertCircle, BarChart3, PieChart, List, 
          Timer, Palette, Edit3, Trophy, Gamepad2, X, Play,
          Lock, Unlock, Clock, PlayCircle, StopCircle, PlusCircle, KeyRound,
          Maximize, Music, Volume2, Power, ArrowDownToLine, ArrowUpToLine,
          Share2, Link, CopyCheck
        } from 'https://esm.sh/lucide-react@0.292.0';
        import { 
          BarChart, Bar, XAxis, YAxis, Tooltip as RechartsTooltip, ResponsiveContainer, 
          PieChart as RePieChart, Pie, Cell, Legend
        } from 'https://esm.sh/recharts@2.10.3';

        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (เชื่อมต่อคลาวด์)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Default config for demo purposes if environment is missing
            projectId: "demo-vote-app",
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-vote-app';

        // --- เสียงประกอบ ---
        const BGM_TRACKS = {
          track1: { name: '🎮 ตื่นเต้น (Action/Upbeat)', url: 'https://upload.wikimedia.org/wikipedia/commons/4/4c/Funk_Game_Loop.ogg' },
          track2: { name: '😰 ลุ้นระทึก (Suspense/Tense)', url: 'https://upload.wikimedia.org/wikipedia/commons/a/a9/Tense_Ambience.ogg' },
          track3: { name: '🕹️ สนุกสนาน (Retro Arcade)', url: 'https://upload.wikimedia.org/wikipedia/commons/e/e5/Tetris_theme.ogg' }
        };

        function App() {
          // System State
          const [isFirebaseReady, setIsFirebaseReady] = useState(false);
          const [hasEntered, setHasEntered] = useState(false);
          const [view, setView] = useState('user');
          const [chartView, setChartView] = useState('list');
          
          // Toast Notification
          const [toastMessage, setToastMessage] = useState({ show: false, text: '' });
          
          // Admin Auth State
          const [isAdminAuth, setIsAdminAuth] = useState(false);
          const [pinInput, setPinInput] = useState('');
          const ADMIN_PIN = '8888';
          const [pinError, setPinError] = useState(false);

          // --- CLOUD STATE ---
          const [roomState, setRoomState] = useState({
            topicTitle: 'ศึกตัดสิน: กิจกรรมวันหยุดประจำปี! 🏖️',
            votingState: 'waiting',
            votingEndTime: 0,
            durationSetting: 30,
            winCondition: 'highest',
            countdownSetting: 10,
            winner: null,
            bgmTrack: 'track1',
            isBgmPlaying: false
          });
          const [options, setOptions] = useState([]);

          // Local UI State based on Cloud
          const [localTimeLeft, setLocalTimeLeft] = useState(0);
          const [showResultOverlay, setShowResultOverlay] = useState(false);
          const [isSpinning, setIsSpinning] = useState(false);
          const [revealTimeLeft, setRevealTimeLeft] = useState(null);

          // Option Form State
          const [newOptionText, setNewOptionText] = useState('');
          const [newOptionEmoji, setNewOptionEmoji] = useState('✨');
          const [newOptionColor, setNewOptionColor] = useState('#f59e0b');

          // Audio Ref
          const audioRef = useRef(null);

          // คำนวณข้อมูลกราฟ
          const totalVotes = options.reduce((sum, opt) => sum + opt.votes, 0);
          const chartData = [...options].sort((a, b) => b.votes - a.votes).map(opt => ({
            name: opt.text,
            votes: opt.votes,
            fill: opt.color
          }));

          // 1. Initialize Firebase Auth
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined') {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
                setIsFirebaseReady(true);
              } catch (error) {
                console.error("Auth error:", error);
                // Even on error, try to proceed for local dev
                setIsFirebaseReady(true); 
              }
            };
            initAuth();
          }, []);

          // 2. Real-time Listeners (ซิงค์ข้อมูลจากฐานข้อมูล)
          useEffect(() => {
            if (!isFirebaseReady) return;

            // แก้ไข Path ฐานข้อมูลให้ถูกต้องตามเงื่อนไข (ต้องมีโครงสร้าง public/data/{collection})
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'room');
            const optionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'options');

            // Set Initial Data if not exists
            getDoc(roomRef).then(snap => {
               if(!snap.exists()) {
                   setDoc(roomRef, roomState).catch(err => console.warn("Initialize room state skipped (permission denied):", err.message));
               }
            }).catch(err => console.warn("Read initial room state failed:", err.message));

            // Listen to Room State
            const unsubRoom = onSnapshot(roomRef, (snap) => {
              if (snap.exists()) {
                const data = snap.data();
                setRoomState(prev => ({...prev, ...data}));
                
                // ควบคุม BGM
                if (audioRef.current) {
                  if (data.isBgmPlaying && audioRef.current.paused && hasEntered) {
                    audioRef.current.play().catch(e => console.log("Audio play blocked:", e));
                  } else if (!data.isBgmPlaying && !audioRef.current.paused) {
                    audioRef.current.pause();
                  }
                }

                // ควบคุมหน้าจอประกาศผลอัตโนมัติ
                if (data.winner) {
                  setShowResultOverlay(true);
                  setIsSpinning(false);
                } else if (data.votingState === 'locked' && !data.winner && isAdminAuth) {
                   // แอดมินเป็นคนสั่งประมวลผลเมื่อเวลาหมดและยังไม่มีคนชนะ
                   startProcessToCloud(data);
                } else if (data.votingState !== 'locked') {
                  setShowResultOverlay(false);
                }
              }
            }, (error) => console.log("Room sync error", error));

            // Listen to Options
            const unsubOptions = onSnapshot(query(optionsRef), (snap) => {
              const opts = [];
              snap.forEach(doc => opts.push({ id: doc.id, ...doc.data() }));
              // Sort by ID to maintain order
              opts.sort((a, b) => parseInt(a.id) - parseInt(b.id));
              setOptions(opts);
            }, (error) => console.log("Options sync error", error));

            return () => { unsubRoom(); unsubOptions(); };
          }, [isFirebaseReady, hasEntered, isAdminAuth]); // เพิ่ม isAdminAuth เพื่อให้แอดมินคนเดียวที่เป็นคนคำนวณผล

          // 3. Global Timer Logic (ทำงานบนทุกเครื่องให้ตรงกัน)
          useEffect(() => {
            let interval;
            if (roomState.votingState === 'active') {
              interval = setInterval(() => {
                const now = Date.now();
                const remaining = Math.max(0, Math.floor((roomState.votingEndTime - now) / 1000));
                setLocalTimeLeft(remaining);

                // ถ้าหมดเวลา แอดมินจะทำการล็อคห้อง
                if (remaining === 0 && isAdminAuth) {
                  handleStopVoting();
                }
              }, 100); // อัปเดตบ่อยขึ้นเพื่อให้ลื่นไหล
            } else {
              setLocalTimeLeft(roomState.durationSetting);
            }
            return () => clearInterval(interval);
          }, [roomState.votingState, roomState.votingEndTime, roomState.durationSetting, isAdminAuth]);

          // --- คัดลอกลิงก์ ---
          const copyToClipboard = () => {
            const url = window.location.href;
            const textArea = document.createElement("textarea");
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              setToastMessage({ show: true, text: 'คัดลอกลิงก์เรียบร้อย ส่งให้เพื่อนได้เลย!' });
              setTimeout(() => setToastMessage({ show: false, text: '' }), 3000);
            } catch (err) {
              console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
          };

          // --- CLOUD UPDATE FUNCTIONS (แทนที่ setState ปกติ) ---
          const updateRoom = async (updates) => {
             try {
               const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'room');
               await updateDoc(roomRef, updates);
             } catch (e) {
               console.error("Update Room Error:", e.message);
             }
          };

          const handleVote = async (id) => {
            if (roomState.votingState !== 'active') return;
            try {
              const optRef = doc(db, 'artifacts', appId, 'public', 'data', 'options', id.toString());
              const snap = await getDoc(optRef);
              if(snap.exists()) {
                 await updateDoc(optRef, { votes: snap.data().votes + 1 });
              }
            } catch (err) {
              console.error("Vote Error:", err.message);
            }
          };

          const handleAddOption = async (e) => {
            e.preventDefault();
            if (!newOptionText.trim()) return;
            
            try {
              const newId = options.length > 0 ? Math.max(...options.map(o => parseInt(o.id))) + 1 : 1;
              const optRef = doc(db, 'artifacts', appId, 'public', 'data', 'options', newId.toString());
              await setDoc(optRef, { 
                text: newOptionText.trim(), votes: 0,
                emoji: newOptionEmoji || '✨', color: newOptionColor
              });
            } catch (err) {
              console.error("Add Option Error:", err.message);
            }

            setNewOptionText('');
            const randomColors = ['#f43f5e', '#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#06b6d4', '#ef4444', '#8b5cf6'];
            setNewOptionColor(randomColors[Math.floor(Math.random() * randomColors.length)]);
          };

          const handleDeleteOption = async (id) => {
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'options', id.toString()));
            } catch (err) {
              console.error("Delete Option Error:", err.message);
            }
          };

          const handleResetVotes = async () => {
             try {
               // Reset votes in cloud
               for (const opt of options) {
                  await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'options', opt.id.toString()), { votes: 0 });
               }
               await updateRoom({ winner: null, votingState: 'waiting' });
             } catch (err) {
               console.error("Reset Votes Error:", err.message);
             }
          };

          const handleResetAll = async () => {
             try {
               for (const opt of options) {
                  await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'options', opt.id.toString()));
               }
               await updateRoom({ winner: null, votingState: 'waiting' });
             } catch (err) {
               console.error("Reset All Error:", err.message);
             }
          };

          const handleStartVoting = async () => {
            const endTime = Date.now() + (roomState.durationSetting * 1000);
            await updateRoom({ votingState: 'active', votingEndTime: endTime, winner: null });
          };

          const handleExtendVoting = async () => {
            const currentEndTime = Math.max(Date.now(), roomState.votingEndTime);
            await updateRoom({ votingEndTime: currentEndTime + (15 * 1000) });
          };

          const handleStopVoting = async () => {
            await updateRoom({ votingState: 'locked' });
            // ผลจะถูกประมวลผลโดย useEffect ของแอดมิน
          };

          // ประมวลผลและประกาศผลไปที่ Cloud
          const startProcessToCloud = (currentRoomState) => {
             if (options.length === 0) return;
             
             // ซิงค์ให้ทุกคนขึ้นจอค้นหา
             setShowResultOverlay(true);
             setIsSpinning(true);
             
             let time = currentRoomState.countdownSetting;
             setRevealTimeLeft(time);

             const timerInterval = setInterval(() => {
               time -= 1;
               setRevealTimeLeft(time);
               if (time <= 0) {
                 clearInterval(timerInterval);
                 
                 // คำนวณผู้ชนะ
                 let selectedWinner = null;
                 const currentTotalVotes = options.reduce((sum, opt) => sum + opt.votes, 0);

                 if (currentTotalVotes === 0) {
                   selectedWinner = options[Math.floor(Math.random() * options.length)];
                 } else {
                   let targetVotes;
                   if (currentRoomState.winCondition === 'highest') {
                     targetVotes = Math.max(...options.map(o => o.votes));
                   } else {
                     targetVotes = Math.min(...options.map(o => o.votes));
                   }
                   const eligibleOptions = options.filter(o => o.votes === targetVotes);
                   selectedWinner = eligibleOptions[Math.floor(Math.random() * eligibleOptions.length)];
                 }

                 // ส่งผู้ชนะไปให้ทุกคนเห็น
                 updateRoom({ winner: selectedWinner });
               }
             }, 1000);
          };

          const handlePinInput = (num) => {
            setPinError(false);
            if (pinInput.length < 4) {
              const newPin = pinInput + num;
              setPinInput(newPin);
              if (newPin.length === 4) {
                if (newPin === ADMIN_PIN) {
                  setTimeout(() => { setIsAdminAuth(true); setPinInput(''); }, 300);
                } else {
                  setPinError(true);
                  setTimeout(() => setPinInput(''), 500);
                }
              }
            }
          };

          const handleEnterSystem = () => {
            setHasEntered(true);
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
              elem.requestFullscreen().catch((err) => console.log("Fullscreen blocked", err));
            } else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
          };

          // -------------------------------------------------------------
          // SCREEN 1: WELCOME / ENTRY SCREEN
          // -------------------------------------------------------------
          if (!hasEntered) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center relative overflow-hidden perspective-1000">
                <div className="absolute inset-0 bg-grid-pattern opacity-40 transform-3d rotate-x-12 scale-150 origin-bottom"></div>
                <div className="absolute w-96 h-96 bg-fuchsia-600/30 rounded-full blur-[100px] animate-pulse"></div>
                
                <div className="z-10 flex flex-col items-center animate-in zoom-in duration-700">
                  <Gamepad2 size={100} className="text-white mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.5)] animate-bounce" />
                  <h1 className="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-fuchsia-400 mb-2 tracking-widest text-center uppercase" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.2)' }}>
                    VOTE ARENA
                  </h1>
                  <p className="text-cyan-400 text-xl mb-12 tracking-widest uppercase font-black bg-cyan-900/40 px-6 py-2 rounded-full border border-cyan-500/50 shadow-[0_0_20px_rgba(34,211,238,0.2)]">
                    🌍 LIVE ONLINE EDITION
                  </p>
                  
                  {!isFirebaseReady ? (
                    <div className="flex flex-col items-center gap-4">
                       <RefreshCw className="animate-spin text-white" size={32} />
                       <p className="text-slate-400 font-bold">Connecting to Cloud...</p>
                    </div>
                  ) : (
                    <button 
                      onClick={handleEnterSystem}
                      className="group bg-indigo-600 text-white text-2xl font-black px-12 py-6 rounded-2xl btn-3d flex items-center gap-4 border-2 border-indigo-400"
                      style={{ '--btn-shadow': '#3730a3', boxShadow: '0 8px 0 #3730a3, 0 15px 30px rgba(0,0,0,0.5)' }}
                    >
                      <Power className="group-hover:animate-spin" size={32} />
                      PRESS START
                    </button>
                  )}
                  <p className="text-slate-500 mt-6 text-sm flex items-center gap-2"><Maximize size={16}/> ระบบจะแสดงผลแบบเต็มหน้าจออัตโนมัติ</p>
                </div>
              </div>
            );
          }

          // -------------------------------------------------------------
          // SCREEN 2: MAIN APPLICATION
          // -------------------------------------------------------------
          return (
            <div className="relative min-h-screen w-full bg-slate-950 font-sans text-slate-800 overflow-x-hidden perspective-1000">
              
              {/* Audio Element */}
              <audio ref={audioRef} src={BGM_TRACKS[roomState.bgmTrack].url} loop preload="auto" />

              {/* Toast Notification */}
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[300] bg-emerald-500 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_30px_rgba(16,185,129,0.5)] flex items-center gap-2 toast ${toastMessage.show ? 'show' : 'hide'}`}>
                <CopyCheck size={20} /> {toastMessage.text}
              </div>

              {/* Game Background Elements */}
              <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-slate-950">
                <div className="absolute inset-0 bg-grid-pattern opacity-30 transform-3d rotate-x-12 scale-150 origin-bottom"></div>
                <div className="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-fuchsia-600/20 rounded-full blur-[100px] animate-pulse"></div>
                <div className="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] bg-cyan-600/20 rounded-full blur-[120px] animate-pulse delay-700"></div>
              </div>

              {/* 🌟 FULLSCREEN RESULT OVERLAY 🌟 */}
              {showResultOverlay && (
                <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-2xl p-4 overflow-hidden perspective-1000 animate-in fade-in duration-500">
                  <div className="absolute inset-0 overflow-hidden pointer-events-none">
                     <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90vw] h-[90vw] bg-indigo-600/10 rounded-full blur-[150px] animate-pulse"></div>
                  </div>

                  <h3 className="text-3xl md:text-5xl font-black text-white mb-8 uppercase tracking-widest text-center z-10 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)] flex items-center justify-center gap-4 animate-in slide-in-from-top-10 duration-700">
                    <Crown className="text-yellow-400" size={48} />
                    {roomState.winCondition === 'highest' ? 'ผู้ชนะคะแนนสูงสุด!' : 'ผู้ชนะคะแนนน้อยสุด!'}
                    <Crown className="text-yellow-400" size={48} />
                  </h3>

                  <div 
                    className={`w-full max-w-4xl h-[40vh] min-h-[350px] flex items-center justify-center rounded-[3rem] relative monitor-3d transition-all duration-1000 ${
                      roomState.winner ? 'border-4 border-yellow-400 scale-105' : 'bg-slate-900 border-4 border-slate-800'
                    }`}
                    style={{ backgroundColor: roomState.winner ? roomState.winner.color : undefined }}
                  >
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/pixel-weave.png')] opacity-20 mix-blend-overlay pointer-events-none rounded-[3rem]"></div>
                    {!roomState.winner && isSpinning && <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-500/20 via-transparent to-transparent animate-pulse rounded-[3rem]"></div>}
                    
                    {isSpinning && revealTimeLeft !== null ? (
                      <div className="flex flex-col items-center justify-center animate-in zoom-in duration-300 relative z-10 transform-3d">
                        <span className="text-cyan-400 font-black mb-4 tracking-widest text-lg md:text-xl uppercase flex items-center gap-2 bg-black/50 px-6 py-2 rounded-full border border-cyan-500/30 shadow-[0_0_20px_rgba(34,211,238,0.2)]">
                          <Timer size={24} className="animate-spin" /> ระบบกำลังค้นหาผลลัพธ์...
                        </span>
                        <div className="text-[8rem] md:text-[12rem] font-black text-white tabular-nums drop-shadow-[0_0_40px_rgba(255,255,255,0.8)] leading-none">{revealTimeLeft}</div>
                      </div>
                    ) : roomState.winner ? (
                      <div className="flex flex-col items-center justify-center animate-in zoom-in-50 duration-700 z-10 w-full px-4 transform-3d">
                        <div className="absolute inset-0 opacity-40 animate-spin-slow rounded-[3rem]" style={{ background: 'repeating-conic-gradient(from 0deg, transparent 0deg 15deg, white 15deg 30deg)' }}></div>

                                      <div className="w-16">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">ไอคอน</label>
                                        <input type="text" maxLength={2} value={newOptionEmoji} onChange={(e) => setNewOptionEmoji(e.target.value)} className="w-full text-center text-2xl py-2 bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                                      </div>
                                      <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">ชื่อตัวเลือก</label>
                                        <input type="text" value={newOptionText} onChange={(e) => setNewOptionText(e.target.value)} placeholder="พิมพ์ชื่อ..." className="w-full px-3 py-3 bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 font-bold" />
                                      </div>
                                    </div>
                                    <div className="flex gap-3 items-end">
                                      <div className="w-full">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">สีประจำตัว</label>
                                        <div className="h-12 rounded-xl overflow-hidden border border-slate-200 relative">
                                          <input type="color" value={newOptionColor} onChange={(e) => setNewOptionColor(e.target.value)} className="absolute -top-2 -left-2 w-20 h-20 cursor-pointer" />
                                          <div className="absolute inset-0 flex items-center justify-center font-mono text-xs font-bold pointer-events-none mix-blend-difference text-white">{newOptionColor}</div>
                                        </div>
                                      </div>
                                      <button type="submit" disabled={!newOptionText.trim()} className="w-full bg-slate-900 text-white h-12 rounded-xl font-black btn-3d" style={{'--btn-shadow':'#000', boxShadow:'0 4px 0 #000'}}>เพิ่มลงคลาวด์</button>
                                    </div>
                                  </form>
                                </div>
                              </div>

                              <div className="lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm border-b-4 border-b-slate-300">
                                <div className="flex justify-between items-center mb-4">
                                  <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Users size={16} /> ผู้เข้าแข่งขัน ({options.length})</h3>
                                  <div className="flex gap-2">
                                    <button onClick={handleResetVotes} className="text-xs font-bold text-orange-600 bg-orange-50 hover:bg-orange-100 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-orange-200"><RefreshCw size={12} /> ล้างคะแนน</button>
                                    <button onClick={handleResetAll} className="text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-rose-200"><Trash2 size={12} /> ลบทั้งหมด</button>
                                  </div>
                                </div>
                                
                                <div className="max-h-[350px] overflow-y-auto space-y-2 pr-2">
                                  {options.map((option) => (
                                    <div key={option.id} className="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-xl">
                                      <div className="flex items-center gap-3">
                                        <span className="text-2xl bg-white w-10 h-10 flex items-center justify-center rounded-lg shadow-sm border border-slate-200">{option.emoji}</span>
                                        <div>
                                          <span className="font-bold text-slate-800 block leading-tight">{option.text}</span>
                                          <div className="flex items-center gap-1 mt-0.5"><span className="w-2 h-2 rounded-full" style={{ backgroundColor: option.color }}></span><span className="text-[10px] text-slate-500 font-mono">{option.color}</span></div>
                                        </div>
                                      </div>
                                      <div className="flex items-center gap-3">
                                        <span className="bg-white px-3 py-1 rounded-lg text-sm font-bold border border-slate-200 shadow-sm">{option.votes} โหวต</span>
                                        <button onClick={() => handleDeleteOption(option.id)} className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition-colors"><X size={18} strokeWidth={3} /></button>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            </div>

                            <div className="pt-8 border-t-2 border-dashed border-slate-200 flex flex-col items-center pb-10">
                              <h3 className="text-2xl font-black text-slate-800 mb-6 uppercase tracking-widest text-center">
                                <Crown className="inline text-yellow-500 mb-1" /> ตั้งค่าการประกาศผล <Crown className="inline text-yellow-500 mb-1" />
                              </h3>

                              <div className="flex flex-col sm:flex-row items-center gap-4 w-full justify-center">
                                <div className="flex items-center gap-2 bg-slate-100 px-4 py-3 rounded-2xl border-b-4 border-slate-300 font-bold text-slate-600">
                                  <Timer size={20} /> ถอยหลังประกาศผล: 
                                  <input type="number" min="3" max="20" value={roomState.countdownSetting} onChange={(e) => updateRoom({countdownSetting: Number(e.target.value)})} className="w-14 bg-white text-center border border-slate-300 rounded p-1 ml-2" />
                                  วิ.
                                </div>
                              </div>
                              
                              <p className="text-slate-500 text-sm mt-6 font-medium text-center bg-blue-50 text-blue-600 px-4 py-2 rounded-xl border border-blue-100">
                                💡 ข้อมูลระบบออนไลน์: เมื่อเวลาโหวตในจอหลักหมดลง (0 วิ) แอดมินจะเป็นผู้คำนวณผู้ชนะตามกติกา และส่งภาพป๊อปอัปให้โชว์ <b>"เต็มจอพร้อมกัน"</b> ในทุกเครื่องทันทีโดยอัตโนมัติ
                              </p>
                            </div>

                          </div>
                        )}
                      </div>
                    )}

                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
